name: Secret scan
on:
  pull_request:
  push:
    branches: ['**']
permissions:
  contents: read
env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject .gitleaksignore files
        run: |
          found="$(find . -name .gitleaksignore -not -path './.git/*' -print -quit)"
          if [ -n "${found}" ]; then
            echo "A .gitleaksignore file is not allowed (found: ${found})"
            exit 1
          fi
      - name: Install gitleaks (checksum verified)
        run: |
          set -euo pipefail
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dest="${RUNNER_TEMP}/gitleaks"
          mkdir -p "${dest}"
          curl -sSfL -o "${dest}/${asset}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${asset}"
          (cd "${dest}" && echo "${GITLEAKS_SHA256}  ${asset}" | sha256sum -c -)
          tar -xzf "${dest}/${asset}" -C "${dest}" gitleaks
          echo "${dest}" >> "${GITHUB_PATH}"
      - name: Self-test (scanner must fail on a runtime-built canary)
        run: |
          set -euo pipefail
          canary_dir="$(mktemp -d "${RUNNER_TEMP}/canary.XXXXXX")"
          suffix="$(head -c 512 /dev/urandom | LC_ALL=C tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'github_token = "%s%s"\n' "ghp_" "${suffix}" > "${canary_dir}/canary.txt"
          set +e
          gitleaks dir "${canary_dir}" --redact --no-banner --ignore-gitleaks-allow --exit-code 42 \
            --config .gitleaks.toml > /dev/null 2>&1
          status=$?
          set -e
          rm -rf "${canary_dir}"
          if [ "${status}" -ne 42 ]; then
            echo "Self-test failed: expected gitleaks exit code 42, got ${status}"
            exit 1
          fi
          echo "Self-test passed: scanner detects a canary secret."
      - name: Self-test (scanner must detect a secret introduced only in a merge commit)
        run: |
          set -euo pipefail
          repo="$(mktemp -d "${RUNNER_TEMP}/merge-canary.XXXXXX")"
          id=(-c user.name=selftest -c user.email=selftest@example.invalid)
          git init -q -b main "${repo}"
          echo base > "${repo}/base.txt"
          git -C "${repo}" add base.txt
          git -C "${repo}" "${id[@]}" commit -q -m base
          git -C "${repo}" checkout -q -b side
          echo side > "${repo}/side.txt"
          git -C "${repo}" add side.txt
          git -C "${repo}" "${id[@]}" commit -q -m side
          git -C "${repo}" checkout -q main
          echo main > "${repo}/main.txt"
          git -C "${repo}" add main.txt
          git -C "${repo}" "${id[@]}" commit -q -m main
          git -C "${repo}" "${id[@]}" merge -q --no-ff --no-commit side
          suffix="$(head -c 512 /dev/urandom | LC_ALL=C tr -dc 'A-Za-z0-9' | head -c 36)"
          printf 'github_token = "%s%s"\n' "ghp_" "${suffix}" > "${repo}/merge-only.txt"
          git -C "${repo}" add merge-only.txt
          git -C "${repo}" "${id[@]}" commit -q -m merge
          set +e
          gitleaks git "${repo}" --redact --no-banner --ignore-gitleaks-allow --exit-code 42 \
            --config .gitleaks.toml --log-opts "-m --all --full-history" > /dev/null 2>&1
          status=$?
          set -e
          rm -rf "${repo}"
          if [ "${status}" -ne 42 ]; then
            echo "Merge self-test failed: expected gitleaks exit code 42, got ${status}"
            exit 1
          fi
          echo "Merge self-test passed: scanner detects a secret that exists only in a merge commit."
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git . --redact --no-banner --ignore-gitleaks-allow --exit-code 1 --config .gitleaks.toml \
            --log-opts "-m ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Scan full history
        if: github.event_name == 'push'
        run: |
          gitleaks git . --redact --no-banner --ignore-gitleaks-allow --exit-code 1 --config .gitleaks.toml \
            --log-opts "-m --all --full-history"
