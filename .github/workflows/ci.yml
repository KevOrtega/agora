name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Canary - network namespace blocks outbound traffic
        run: |
          # Must FAIL to reach the internet inside a loopback-only namespace; the step fails if the fetch succeeds.
          if sudo env "PATH=$PATH" "HOME=$HOME" unshare --net -- bash -c 'ip link set lo up && exec sudo -u "$0" env "PATH=$PATH" "HOME=$HOME" node -e "fetch(\"https://example.com\").then(() => process.exit(0), () => process.exit(1))"' "$(id -un)"; then
            echo "Network namespace did not block outbound traffic" >&2
            exit 1
          fi
      - name: Tests with the network blocked (loopback-only namespace)
        run: sudo env "PATH=$PATH" "HOME=$HOME" unshare --net -- bash -c 'ip link set lo up && exec sudo -u "$0" env "PATH=$PATH" "HOME=$HOME" npm test' "$(id -un)"
