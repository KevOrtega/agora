name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Canary - network namespace blocks outbound traffic
        run: |
          # Succeeds only if, inside the namespace, lo came up, node ran, and the fetch was rejected.
          # Node exits 0 only in the rejection handler (1 if the fetch resolves); any setup error fails the step.
          sudo env "PATH=$PATH" "HOME=$HOME" unshare --net -- bash -ec 'ip link set lo up && exec sudo -u "$0" env "PATH=$PATH" "HOME=$HOME" node -e "fetch(\"https://example.com\").then(() => process.exit(1), () => process.exit(0))"' "$(id -un)"
      - name: Tests with the network blocked (loopback-only namespace)
        run: sudo env "PATH=$PATH" "HOME=$HOME" unshare --net -- bash -c 'ip link set lo up && exec sudo -u "$0" env "PATH=$PATH" "HOME=$HOME" npm test' "$(id -un)"
